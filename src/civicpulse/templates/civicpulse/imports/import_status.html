{% extends "civicpulse/base.html" %}

{% block content %}
<div class="px-4 max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{% url 'civicpulse:voter_import' pk=election.pk %}" class="text-green-700 hover:underline text-sm">&larr; Back to Import</a>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Import Status</h1>
        <p class="text-gray-600 mb-6">{{ import_job.file_name }} &rarr; {{ election }}</p>

        <div id="progress-container"
             {% if import_job.status == 'pending' or import_job.status == 'processing' %}
             hx-get="{% url 'civicpulse:import_progress' pk=election.pk job_pk=import_job.pk %}"
             hx-trigger="every 1s"
             hx-swap="innerHTML"
             {% endif %}>
            {% include "civicpulse/imports/partials/_import_progress.html" %}
        </div>
    </div>
</div>
{% endblock %}
