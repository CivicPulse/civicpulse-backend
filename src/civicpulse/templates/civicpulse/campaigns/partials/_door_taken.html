<!-- Door Already Claimed by Another Volunteer -->
<div class="bg-yellow-50 border border-yellow-200 rounded-lg p-6 text-center">
    <div class="text-yellow-600 mb-3">
        <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
    </div>
    <h3 class="text-lg font-medium text-yellow-800 mb-2">Door Already Claimed</h3>
    <p class="text-yellow-700 mb-4">{{ message }}</p>
    <button type="button"
            hx-get="{% url 'civicpulse:knocking_list' pk=campaign.pk %}"
            hx-target="#person-container"
            hx-swap="innerHTML"
            class="text-white bg-yellow-600 hover:bg-yellow-700 font-medium rounded-lg text-sm px-5 py-2.5">
        Refresh Door List
    </button>
</div>
