[project]
name = "example-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.0",
    "django>=5.2.9",
    "python-decouple>=3.8",
    "stripe>=14.1.0",
]
[project.optional-dependencies]
compressor = [
    "django-compressor>=4.4",
]
async = [
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "django-celery-results>=2.5.0",
]
geo = [
    "psycopg[binary]>=3.1.0",  # PostgreSQL driver with PostGIS support
    "geopy>=2.4.0",  # Geocoding (OpenCage, Nominatim)
    "requests>=2.31.0",  # HTTP client for OSRM routing API
]
dev = [
    "black>=24.0",
    "ruff>=0.1",
    "djlint>=1.34",
    "pytest>=8.0",
    "pytest-django>=4.7",
    "coverage>=7.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
