{% extends "_base.html" %}

{% block content %}
<div class="px-4 max-w-lg mx-auto">
    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-xl font-bold text-gray-900 mb-4">Delete Campaign</h1>

        <p class="text-gray-600 mb-6">
            Are you sure you want to delete <strong>{{ campaign.name }}</strong>?
            This will also delete all assignments and contact attempts associated with this campaign.
            This action cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="flex gap-3">
                <button type="submit" class="text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg text-sm px-5 py-2.5">
                    Yes, Delete Campaign
                </button>
                <a href="{% url 'campaign_detail' pk=campaign.pk %}" class="text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 font-medium rounded-lg text-sm px-5 py-2.5">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
