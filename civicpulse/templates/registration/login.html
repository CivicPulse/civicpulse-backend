{% load compress %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CivicPulse</title>

    {% compress css %}
    <link rel="stylesheet" href="{% static 'src/output.css' %}">
    {% endcompress %}
</head>

<body class="bg-green-50">
    <div class="flex min-h-screen items-center justify-center px-4">
        <div class="w-full max-w-sm md:max-w-md">
            <div class="mb-8 text-center">
                <h1 class="text-3xl font-bold text-green-800">CivicPulse</h1>
                <p class="mt-2 text-gray-600">Sign in to your account</p>
            </div>

            <div class="bg-white rounded-lg shadow-md p-8">
                {% if form.errors %}
                <div class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg">
                    <p>Invalid username or password. Please try again.</p>
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="id_username" class="block mb-2 text-sm font-medium text-gray-700">Username</label>
                        <input type="text" name="username" id="id_username" required autofocus
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
                    </div>

                    <div class="mb-6">
                        <label for="id_password" class="block mb-2 text-sm font-medium text-gray-700">Password</label>
                        <input type="password" name="password" id="id_password" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
                    </div>

                    <button type="submit"
                        class="w-full px-4 py-2 text-white bg-green-700 rounded-lg hover:bg-green-800 focus:outline-none focus:ring-4 focus:ring-green-300">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
