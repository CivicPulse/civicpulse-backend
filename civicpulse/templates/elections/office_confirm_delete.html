{% extends "_base.html" %}

{% block content %}
<div class="px-4 max-w-lg mx-auto">
    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Delete Office</h1>

        <p class="text-gray-600 mb-6">
            Are you sure you want to delete <strong>{{ office.name }}</strong>?
            This will also delete all associated elections and candidates.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="flex gap-4">
                <button type="submit" class="text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5">
                    Yes, Delete
                </button>
                <a href="{% url 'office_detail' pk=office.pk %}" class="text-gray-600 border border-gray-300 hover:bg-gray-50 font-medium rounded-lg text-sm px-5 py-2.5">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
