[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-civicpulse"
version = "0.1.0"
description = "Contact management, election tracking, and campaign orchestration for civic organizations"
readme = "README.rst"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "CivicPulse Contributors"}
]
keywords = [
    "django",
    "civic",
    "election",
    "voter",
    "campaign",
    "nonprofit",
    "crm",
    "phone-banking",
    "canvassing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=5.0",
]

[project.optional-dependencies]
compressor = [
    "django-compressor>=4.4",
]
async = [
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "django-celery-results>=2.5.0",
]
dev = [
    "black>=24.0",
    "ruff>=0.1",
    "djlint>=1.34",
    "pytest>=8.0",
    "pytest-django>=4.7",
    "coverage>=7.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/civicpulse/django-civicpulse"
Documentation = "https://django-civicpulse.readthedocs.io"
Repository = "https://github.com/civicpulse/django-civicpulse"
Changelog = "https://github.com/civicpulse/django-civicpulse/blob/main/CHANGELOG.md"
Issues = "https://github.com/civicpulse/django-civicpulse/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civicpulse = [
    "templates/**/*.html",
    "static/**/*",
    "locale/**/*.mo",
    "locale/**/*.po",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
exclude = '''
/(
    \.git
    | \.venv
    | migrations
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example.settings"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src", "example_project"]

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
]
